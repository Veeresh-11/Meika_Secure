name: Meika PR Security Gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: >-
    ${{ github.workflow }}-
    ${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # NEW — Secret scanning (Gitleaks). Standard first line of defense at
  # world-class shops: catches committed API keys, tokens, and credentials
  # BEFORE merge. Runs as its own fast job so a leaked secret blocks the PR
  # without waiting on the full 20+ minute pr-gate job below.
  # ──────────────────────────────────────────────────────────────────────────
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout (full history for accurate diff scanning)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "true"

  # ──────────────────────────────────────────────────────────────────────────
  # NEW — GitHub's native Dependency Review. Complements pip-audit: pip-audit
  # scans the whole dependency tree on every run, but isn't diff-aware.
  # Dependency Review specifically flags NEW vulnerable/license-incompatible
  # dependencies introduced by *this* PR against the GitHub Advisory
  # Database, and can annotate the PR diff directly. Only meaningful on
  # pull_request events (it has no base ref to diff against otherwise).
  # ──────────────────────────────────────────────────────────────────────────
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6
      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  # ──────────────────────────────────────────────────────────────────────────
  # NEW — OSSF Scorecard. The same supply-chain security posture check run
  # by GitHub, Google, and most major open-source foundations — scores the
  # repo on branch protection, pinned dependencies, vulnerable dependencies,
  # dangerous workflow patterns, code review practices, etc. Free, and
  # results publish to the public OpenSSF database (great to be able to
  # point to when a customer/auditor asks "how do you compare to Okta's
  # security posture?"). Evaluates repo-wide state, so it only makes sense
  # on push to main, not per-PR.
  # ──────────────────────────────────────────────────────────────────────────
  scorecard:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run OSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scorecard-results.sarif

  pr-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      checkout: ${{ steps.checkout.outcome }}
      redis_ready: ${{ steps.redis_ready.outcome }}
      setup_python: ${{ steps.setup_python.outcome }}
      codeql_init: ${{ steps.codeql_init.outcome }}
      dependencies: ${{ steps.install_dependencies.outcome }}
      postgres_ready: ${{ steps.wait_for_db.outcome }}
      db_bootstrap: ${{ steps.bootstrap_db.outcome }}
      migration_chain: ${{ steps.verify_migration_chain.outcome }}
      postgres_version: ${{ steps.postgres_version.outcome }}
      test_db_bootstrap: ${{ steps.bootstrap_test_db.outcome }}
      dependency_audit: ${{ steps.dependency_audit.outcome }}
      bandit: ${{ steps.bandit_scan.outcome }}
      semgrep: ${{ steps.semgrep_scan.outcome }}
      tests: ${{ steps.tests_coverage.outcome }}
      trivy_fs: ${{ steps.trivy_scan.outcome }}
      trivy_config: ${{ steps.trivy_config_scan.outcome }}
      red_team: ${{ steps.red_team_tests.outcome }}
      codeql: ${{ steps.codeql_analyze.outcome }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    permissions:
      contents: read
      security-events: write

    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
      PYTHONPATH: .
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: test_db
      DB_USER: test_user
      DB_PASSWORD: test_pass
      DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
      EVIDENCE_DSN: postgresql://test_user:test_pass@localhost:5432/test_db
      POSTGRES_DSN: postgresql://test_user:test_pass@localhost:5432/test_db
      POSTGRES_TEST_DSN: postgresql://test_user:test_pass@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379/0
      SIGNING_PRIVATE_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      ENVIRONMENT: test
      SECRET_KEY: test-secret-key-for-ci-only-not-production
      JWT_SECRET_KEY: "ci-only-jwt-secret-key-at-least-32-chars"
      JWT_ISSUER: https://meika.test
      ALGORITHM: EdDSA
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONUNBUFFERED: 1

    steps:
      # ────────────────────────────────────────────────────────────────────
      # NEW — Harden-Runner (StepSecurity, free). Same protection added to
      # deep-scan.yml: monitors/can block unexpected outbound network calls
      # during the run and flags tampered Actions — supply-chain protection
      # for the CI pipeline itself. "audit" mode logs only; switch to
      # "block" after reviewing a few runs' egress reports.
      # ────────────────────────────────────────────────────────────────────
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Start Redis with explicit CI configuration
        id: redis_ready
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/redis-ci.conf" <<'REDISCONF'
          bind 0.0.0.0
          protected-mode no
          port 6379
          save ""
          appendonly no
          loglevel notice
          REDISCONF
          docker run --detach --name meika-ci-redis \
            --publish 127.0.0.1:6379:6379 \
            --volume "$RUNNER_TEMP/redis-ci.conf:/usr/local/etc/redis/redis.conf:ro" \
            redis:7-alpine redis-server /usr/local/etc/redis/redis.conf
          for attempt in $(seq 1 30); do
            if docker exec meika-ci-redis redis-cli ping | grep -q PONG; then
              echo "Redis is ready with explicit configuration."
              exit 0
            fi
            sleep 1
          done
          docker logs meika-ci-redis
          echo "::error::Redis did not become ready."
          exit 1

      - name: Setup Python
        id: setup_python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # Free disk space — prevents CodeQL "disk space constraints" failure
      - name: Free disk space for CodeQL
        run: |
          # Remove only the cached CodeQL bundle. Preserve the Python toolcache
          # selected by setup-python and avoid expensive recursive runner cleanup.
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean -qq
          df -h /
      - name: Init CodeQL
        id: codeql_init
        uses: github/codeql-action/init@v4
        with:
          languages: python

      # Install all dependencies
      - name: Install Dependencies
        id: install_dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi
          pip install \
            pytest==9.0.3 \
            pytest-cov==7.1.0 \
            pytest-asyncio==1.3.0 \
            pytest-mock==3.14.0 \
            psycopg2-binary==2.9.10 \
            redis==5.2.1 \
            anyio==4.14.2 \
            httpx==0.28.1 \
            pip-audit==2.10.1 \
            "bandit[sarif]==1.9.4"
      - name: Verify tenant ORM contract
        run: |
          python - <<'PY'
          from app.db.models import Organization, User

          assert "tenant_id" in User.__table__.columns, "User.tenant_id is missing"
          tenant = User.__table__.columns["tenant_id"]
          assert tenant.nullable is False, "User.tenant_id must be non-nullable"
          assert any(
              fk.target_fullname == "identity.organizations.id"
              for fk in tenant.foreign_keys
          ), "User.tenant_id must reference identity.organizations.id"
          assert Organization.__table__.schema == "identity"
          print("PASS: User tenant ownership matches the identity tenant model")
          PY

      # DB-011 — authoritative migration/bootstrap path
      - name: Wait for DB
        id: wait_for_db
        run: |
          until pg_isready -h localhost -p 5432 -U test_user; do
            echo "Waiting for postgres..."
            sleep 2
          done
          echo "Postgres is ready"

      - name: Generate Ephemeral CI Signing Key
        run: |
          python - <<'PYKEY'
          import os
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives import serialization

          key = Ed25519PrivateKey.generate()
          raw = key.private_bytes(
              serialization.Encoding.Raw,
              serialization.PrivateFormat.Raw,
              serialization.NoEncryption(),
          )
          print(f"::add-mask::{raw.hex()}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"SIGNING_PRIVATE_KEY={raw.hex()}\n")
          PYKEY

      - name: Bootstrap Database
        id: bootstrap_db
        run: |
          python scripts/bootstrap_db.py

      - name: Show Applied Migrations
        run: |
          PGPASSWORD=test_pass psql \
            -h localhost \
            -U test_user \
            -d test_db \
            -c "SELECT version, applied_at FROM schema_migrations ORDER BY version;"

      ####################################################################
      # Verify Exact Migration Chain (DB-011)
      ####################################################################

      - name: Verify Exact Migration Chain
        id: verify_migration_chain
        run: |
          python - <<'PY'
          import os
          import psycopg2

          expected_versions = [
              "000_create_identity_foundation.sql",
              "001_create_evidence_log.sql",
              "002_create_evidence_ledger.sql",
              "003_enforce_append_only.sql",
              "004_create_webauthn.sql",
              "005_create_grants.sql",
              "006_extended_sessions.sql",
              "007_reconcile_grant_schema.sql",
              "008_reconcile_device_relationships.sql",
              "009_reconcile_webauthn_trust_defaults.sql",
              "010_reconcile_evidence_ledger_schema.sql",
              "011_enforce_evidence_genesis_invariant.sql",
              "012_initialize_schema_checksum.sql",
              "013_create_tenant_foundation.sql",
              "014_add_webauthn_challenge_tenant.sql",
              "015_add_session_tenant.sql",
              "016_add_grant_tenant.sql",
              "017_add_audit_log_tenant.sql",
          ]

          conn = psycopg2.connect(
              host=os.environ["DB_HOST"],
              port=int(os.environ["DB_PORT"]),
              dbname=os.environ["DB_NAME"],
              user=os.environ["DB_USER"],
              password=os.environ["DB_PASSWORD"],
          )

          try:
              with conn.cursor() as cur:
                  cur.execute(
                      """
                      SELECT version
                      FROM schema_migrations
                      ORDER BY version
                      """
                  )
                  actual_versions = [row[0] for row in cur.fetchall()]

              print("===== DB-011 MIGRATION CHAIN VERIFICATION =====")
              print(f"Expected migration count: {len(expected_versions)}")
              print(f"Actual migration count:   {len(actual_versions)}")
              print(f"Actual versions:          {actual_versions}")

              if actual_versions != expected_versions:
                  raise SystemExit(
                      "FAIL: migration history does not exactly match 000-017"
                  )

              print("PASS: migration history exactly matches 000-017")
          finally:
              conn.close()
          PY

      - name: PostgreSQL Version
        id: postgres_version
        run: |
          PGPASSWORD=test_pass psql \
            -h localhost \
            -U test_user \
            -d test_db \
            -c "SELECT version();"

      # ────────────────────────────────────────────────────────────────────
      # NEW — same issue found and fixed in the deep-scan workflow:
      # app/conftest.py connects to a separate database named
      # "meika_secure_id_test". Create it if absent, then provision it
      # through the authoritative migration chain in the next step.
      # ────────────────────────────────────────────────────────────────────
      - name: Create pytest fixture database (conftest.py)
        run: |
          PGPASSWORD=test_pass psql \
            -h localhost -p 5432 -U test_user -d test_db \
            -tc "SELECT 1 FROM pg_database WHERE datname = 'meika_secure_id_test'" \
            | grep -q 1 || \
          PGPASSWORD=test_pass psql \
            -h localhost -p 5432 -U test_user -d test_db \
            -c "CREATE DATABASE meika_secure_id_test;"

      # Provision pytest's separate database through the authoritative migration chain.
      - name: Bootstrap and validate pytest database
        id: bootstrap_test_db
        env:
          DB_NAME: meika_secure_id_test
        run: |
          python scripts/bootstrap_db.py

      # Dependency CVE audit — findings block the PR.
      - name: Dependency Audit
        id: dependency_audit
        continue-on-error: true
        run: pip-audit -r requirements.txt -r requirements-dev.txt --desc on

      # Bandit SAST
      - name: Bandit Scan
        id: bandit_scan
        continue-on-error: true
        run: |
          set +e
          bandit -r app/ -ll -f txt
          BANDIT_EXIT=$?
          bandit -r app/ -f sarif -o bandit.sarif -ll
          SARIF_EXIT=$?
          if [ ! -f bandit.sarif ]; then
            printf '%s\n' '{"version":"2.1.0","runs":[]}' > bandit.sarif
          fi
          echo "Bandit text exit code: $BANDIT_EXIT"
          echo "Bandit SARIF exit code: $SARIF_EXIT"
          exit "$BANDIT_EXIT"
      - name: Upload Bandit SARIF
        run: |
          HAS=$(python3 -c "
          import json
          d=json.load(open('bandit.sarif'))
          results=[r for run in d.get('runs',[]) for r in run.get('results',[])]
          print('true' if results else 'false')
          " 2>/dev/null || echo "false")
          echo "BANDIT_HAS=$HAS" >> $GITHUB_ENV
      - name: Upload Bandit SARIF to CodeQL
        if: env.BANDIT_HAS == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit.sarif

      # ────────────────────────────────────────────────────────────────────
      # Semgrep SAST
      # UPGRADED — "auto" alone doesn't guarantee JWT-specific or
      # secrets-specific rules always fire (it's heuristic based on
      # detected languages/frameworks). Since this IS an identity/token
      # platform, explicitly pinning p/jwt and p/secrets alongside
      # p/security-audit ensures those checks always run regardless of
      # what auto-detection decides. All free, open-source Semgrep
      # Registry rulesets — no Semgrep App/Cloud account needed.
      # ────────────────────────────────────────────────────────────────────
      - name: Semgrep
        id: semgrep_scan
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            semgrep/semgrep:1.180.0 semgrep scan --error \
              --config p/security-audit \
              --config p/secrets \
              --config p/jwt \
              --config p/python \
              --config p/owasp-top-ten /src/app

      # ── TESTS + COVERAGE ───────────────────────────────────────────────────
      # Enforce a meaningful minimum: the last full run measured 86.51% branch
      # coverage, so 85% raises the bar while leaving a narrow regression margin.
      # Pytest warnings are errors; the JUnit validator rejects skips/failures.
      # ────────────────────────────────────────────────────────────────────────
      - name: Tests + Coverage
        id: tests_coverage
        run: |
          echo "=== Config sanity check ==="
          python3 -m pytest --co -q --no-header 2>&1 | head -10 || true
          echo "==========================="
          PYTHONTRACEMALLOC=25 python3 -m pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=85 \
            --junitxml=pytest-results.xml \
            -rs \
            -W error
          python3 scripts/validate_pytest_results.py pytest-results.xml
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

      # Trivy filesystem vulnerability scan
      - name: Trivy Scan
        id: trivy_scan
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.35.0
        with:
          version: 'v0.72.0'
          cache: false
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: sarif
          output: trivy.sarif

      # NEW — Trivy config/IaC scan (Dockerfile misconfig, workflow
      # permission issues, etc.) — same addition as deep-scan.yml.
      - name: Trivy Config/IaC Scan
        id: trivy_config_scan
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.35.0
        with:
          version: 'v0.72.0'
          cache: false
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: sarif
          output: trivy-config.sarif

      - name: Upload Trivy Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: |
            trivy.sarif
            trivy-config.sarif
          if-no-files-found: ignore

      # ────────────────────────────────────────────────────────────────────
      # Red Team adversarial tests
      # FIX — path was app/security/tests/test_red_team_attacks.py, which
      # doesn't exist (extra "tests/" subfolder). Confirmed real path is
      # app/security/test_red_team_attacks.py — same bug found and fixed
      # in the deep-scan workflow.
      # ────────────────────────────────────────────────────────────────────
      - name: Red Team Tests
        env:
          CI_SECURITY_BYPASS: "0"
        id: red_team_tests
        if: always()
        run: |
          if [ -f app/security/test_red_team_attacks.py ]; then
            python3 -m pytest \
              app/security/test_red_team_attacks.py \
              -v --tb=short \
              -p no:cacheprovider
          else
            echo "::error::Required red-team test file app/security/test_red_team_attacks.py is missing."
            exit 1
          fi
      # CodeQL analysis
      - name: CodeQL Analyze
        id: codeql_analyze
        if: always()
        uses: github/codeql-action/analyze@v4
        with:
          upload: true

      # Run the final gate after all diagnostics so one scanner finding
      # does not prevent the full test and security suite from executing.
      # The finding still fails the job; it is never silently ignored.
      - name: Enforce security gate after diagnostics
        if: always()
        env:
          DEPENDENCY_AUDIT_OUTCOME: ${{ steps.dependency_audit.outcome }}
          BANDIT_OUTCOME: ${{ steps.bandit_scan.outcome }}
          SEMGREP_OUTCOME: ${{ steps.semgrep_scan.outcome }}
          TESTS_OUTCOME: ${{ steps.tests_coverage.outcome }}
          TRIVY_OUTCOME: ${{ steps.trivy_scan.outcome }}
          TRIVY_CONFIG_OUTCOME: ${{ steps.trivy_config_scan.outcome }}
          RED_TEAM_OUTCOME: ${{ steps.red_team_tests.outcome }}
          CODEQL_OUTCOME: ${{ steps.codeql_analyze.outcome }}
        run: |
          failed=0
          for item in \
            "Dependency-audit:$DEPENDENCY_AUDIT_OUTCOME" \
            "Bandit:$BANDIT_OUTCOME" \
            "Semgrep:$SEMGREP_OUTCOME" \
            "Tests-and-coverage:$TESTS_OUTCOME" \
            "Trivy:$TRIVY_OUTCOME" \
            "Trivy-config:$TRIVY_CONFIG_OUTCOME" \
            "Red-team-tests:$RED_TEAM_OUTCOME" \
            "CodeQL:$CODEQL_OUTCOME"; do
            name="${item%%:*}"
            outcome="${item#*:}"
            echo "$name outcome: $outcome"
            if [ "$outcome" != "success" ]; then
              echo "::error::$name did not pass."
              failed=1
            fi
          done
          exit "$failed"


  quality-score:
    name: PR Gate Quality Score (100 points per check)
    if: always() && github.event_name == 'pull_request'
    needs: [secret-scan, dependency-review, pr-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Checkout scoring script
        uses: actions/checkout@v6
      - name: Calculate and enforce quality score
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          SECRET_SCAN: ${{ needs.secret-scan.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          CHECKOUT: ${{ needs.pr-gate.outputs.checkout }}
          REDIS_READY: ${{ needs.pr-gate.outputs.redis_ready }}
          SETUP_PYTHON: ${{ needs.pr-gate.outputs.setup_python }}
          CODEQL_INIT: ${{ needs.pr-gate.outputs.codeql_init }}
          DEPENDENCIES: ${{ needs.pr-gate.outputs.dependencies }}
          POSTGRES_READY: ${{ needs.pr-gate.outputs.postgres_ready }}
          DB_BOOTSTRAP: ${{ needs.pr-gate.outputs.db_bootstrap }}
          MIGRATION_CHAIN: ${{ needs.pr-gate.outputs.migration_chain }}
          POSTGRES_VERSION: ${{ needs.pr-gate.outputs.postgres_version }}
          TEST_DB_BOOTSTRAP: ${{ needs.pr-gate.outputs.test_db_bootstrap }}
          DEPENDENCY_AUDIT: ${{ needs.pr-gate.outputs.dependency_audit }}
          BANDIT: ${{ needs.pr-gate.outputs.bandit }}
          SEMGREP: ${{ needs.pr-gate.outputs.semgrep }}
          TESTS: ${{ needs.pr-gate.outputs.tests }}
          TRIVY_FS: ${{ needs.pr-gate.outputs.trivy_fs }}
          TRIVY_CONFIG: ${{ needs.pr-gate.outputs.trivy_config }}
          RED_TEAM: ${{ needs.pr-gate.outputs.red_team }}
          CODEQL: ${{ needs.pr-gate.outputs.codeql }}
        run: |
          set -euo pipefail
          # GitHub does not expose a workflow's downloadable log archive until
          # the entire workflow run has completed. This job is part of that run,
          # so fetching its own logs here always races/fails. Test warnings are
          # already fatal via pytest -W error; scanner findings are enforced by
          # their steps. Score the explicit job/step outcomes here.
          python .github/scripts/score_pr_gate.py
