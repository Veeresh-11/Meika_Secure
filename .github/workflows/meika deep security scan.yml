name: Meika Deep Security Scan

# ─── Triggers ────────────────────────────────────────────────────────────────
on:
  # Run against the actual PR commit. Do not use workflow_run to execute PR
  # code in the privileged workflow_run context.
  pull_request:
  workflow_run:
    workflows:
      - "Meika PR Security Gate"
    types:
      - completed
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  deep-scan:
    # Only run if the gate workflow succeeded (or if triggered manually/scheduled)
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 60   # ZAP + Nuclei + Schemathesis + pip-audit + bandit all take time

    # ── FIX 1: PostgreSQL service — API server crashes without DB ─────────────
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Security enforcement remains enabled during adversarial scans.
      PYTHONPATH: "."

      # ── DB (match service above) ──────────────────────────────────────────
      DB_HOST: "localhost"
      DB_PORT: "5432"
      DB_NAME: "test_db"
      DB_USER: "test_user"
      DB_PASSWORD: "test_pass"
      DATABASE_URL: "postgresql://test_user:test_pass@localhost:5432/test_db"
      POSTGRES_TEST_DSN: "postgresql+psycopg://test_user:test_pass@localhost:5432/meika_evidence_test"
      WEBAUTHN_TEST_DSN: "postgresql+psycopg://test_user:test_pass@localhost:5432/meika_secure_id_test"
      EVIDENCE_DSN: "postgresql://test_user:test_pass@localhost:5432/meika_evidence_test"

      # ── Redis ─────────────────────────────────────────────────────────────
      REDIS_URL: "redis://localhost:6379/0"

      # ── App secrets (CI-only, not production) ─────────────────────────────
      SECRET_KEY: "ci-test-secret-key-not-for-production"
      JWT_SECRET_KEY: "ci-only-jwt-secret-key-at-least-32-chars"
      JWT_ISSUER: "https://meika.test"
      ALGORITHM: "EdDSA"
      ENVIRONMENT: "test"

      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      # Harden Runner intentionally omitted: its Docker daemon restart invalidated
      # the PostgreSQL service port in observed CI runs.

      # ────────────────────────────────────────────────────────────────────────
      # 1. Checkout
      # ────────────────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v6

      - name: Start Redis with explicit CI configuration
        run: |
          set -euo pipefail
          sudo sysctl -w vm.overcommit_memory=1
          cat > "$RUNNER_TEMP/redis-ci.conf" <<'REDISCONF'
          bind 0.0.0.0
          protected-mode no
          port 6379
          save ""
          appendonly no
          loglevel notice
          REDISCONF
          docker run --detach --name meika-deep-scan-redis \
            --publish 127.0.0.1:6379:6379 \
            --volume "$RUNNER_TEMP/redis-ci.conf:/usr/local/etc/redis/redis.conf:ro" \
            redis:7-alpine redis-server /usr/local/etc/redis/redis.conf
          for attempt in $(seq 1 30); do
            if docker exec meika-deep-scan-redis redis-cli ping | grep -q PONG; then
              echo "Redis is ready with explicit configuration."
              exit 0
            fi
            sleep 1
          done
          docker logs meika-deep-scan-redis
          echo "::error::Redis did not become ready."
          exit 1

      # ────────────────────────────────────────────────────────────────────────
      # 2. Python
      # ────────────────────────────────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # ────────────────────────────────────────────────────────────────────────
      # 3. Install Dependencies
      # ────────────────────────────────────────────────────────────────────────
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi
          # Deep-scan specific packages
          pip install \
            pytest==9.0.3 \
            pytest-asyncio==1.3.0 \
            pytest-mock==3.14.0 \
            psycopg2-binary==2.9.10 \
            redis==5.2.1 \
            httpx==0.28.1 \
            anyio==4.14.2 \
            schemathesis==4.30.1 \
            hypothesis==6.138.15 \
            cyclonedx-bom==7.5.0 \
            pip-audit==2.10.1 \
            bandit==1.9.4 \
            uvicorn==0.35.0

      # Use a fresh ephemeral Ed25519 key for this CI run. Never disable the signer.
      - name: Generate ephemeral CI signing key
        id: signing_key
        run: |
          python - <<'PYKEY' >> "$GITHUB_ENV"
          import os
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives import serialization

          key = Ed25519PrivateKey.generate()
          raw = key.private_bytes(
              serialization.Encoding.Raw,
              serialization.PrivateFormat.Raw,
              serialization.NoEncryption(),
          )
          print(f"SIGNING_PRIVATE_KEY={raw.hex()}")
          print(f"signing_private_key={raw.hex()}", file=open(os.environ["GITHUB_OUTPUT"], "a"))
          PYKEY

      # ────────────────────────────────────────────────────────────────────────
      # NEW — Auto-resolve compatible versions for CLI tools prone to
      # flag/format drift between releases (this is exactly what broke
      # Nuclei, Schemathesis, and ZAP repeatedly across earlier runs).
      #
      # For each tool: try the latest release, run a lightweight SELF-TEST
      # against the tool's own --help output (never against the live app),
      # and if that self-test fails, walk backwards through published
      # versions on PyPI until one passes. This deliberately never touches
      # application code or the live API, so it can only ever "fix" a
      # dependency/CLI compatibility problem — it cannot mask or paper
      # over a real bug in the app itself.
      #
      # Scope: only applies to pip-installed tools here (schemathesis,
      # bandit, pip-audit, cyclonedx-bom). Nuclei's binary version and the
      # ZAP Docker image are managed differently (nuclei-action has a
      # separate `nuclei-version:` input; ZAP uses a Docker tag) — those
      # would need a follow-up step using the same pattern if wanted.
      #
      # Capped at 8 fallback attempts per tool to bound worst-case runtime.
      # ────────────────────────────────────────────────────────────────────────
      # Tool versions are pinned above; do not silently replace them with
      # whatever happens to be latest during a scan.
      # Bootstrap the database with ordered migrations and fail-fast validation.
      - name: Bootstrap and validate application database
        timeout-minutes: 3
        run: |
          for attempt in $(seq 1 60); do
            if pg_isready -h localhost -p 5432 -U test_user -d test_db; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "::error::PostgreSQL service did not become reachable within 120 seconds."
              docker ps -a
              docker logs "$(docker ps -aq --filter ancestor=postgres:16 | head -1)" || true
              exit 1
            fi
            echo "Waiting for postgres ($attempt/60)..."
            sleep 2
          done
          DB_NAME=test_db python scripts/bootstrap_db.py
      - name: Bootstrap and validate pytest database
        env:
          PGPASSWORD: test_pass
        run: |
          if ! psql -h localhost -p 5432 -U test_user -d test_db -Atqc \
            "SELECT 1 FROM pg_database WHERE datname = 'meika_secure_id_test'" | grep -qx 1; then
            createdb -h localhost -p 5432 -U test_user meika_secure_id_test
          fi
          DB_NAME=meika_secure_id_test python scripts/bootstrap_db.py
      - name: Bootstrap and validate evidence integration database
        env:
          PGPASSWORD: test_pass
        run: |
          if ! psql -h localhost -p 5432 -U test_user -d test_db -Atqc \
            "SELECT 1 FROM pg_database WHERE datname = 'meika_evidence_test'" | grep -qx 1; then
            createdb -h localhost -p 5432 -U test_user meika_evidence_test
          fi
          DB_NAME=meika_evidence_test python scripts/bootstrap_db.py
      - name: Start API Server
        env:
          # Explicit step-level value prevents any stale job-level placeholder
          # from overriding the freshly generated valid 32-byte Ed25519 key.
          SIGNING_PRIVATE_KEY: ${{ steps.signing_key.outputs.signing_private_key }}
        run: |
          uvicorn app.main:app \
            --host 0.0.0.0 \
            --port 8000 \
            --log-level info \
            > /tmp/uvicorn.log 2>&1 &
          echo "Waiting for API server to be ready..."
          timeout 90s bash -c '
            until curl -sf http://127.0.0.1:8000/openapi.json > /dev/null 2>&1; do
              echo "  still waiting..."
              sleep 2
            done
          ' || {
            echo "FATAL: API server did not start in 90s. Logs:"
            cat /tmp/uvicorn.log
            exit 1
          }
          echo "API server is up."
          curl -s http://127.0.0.1:8000/openapi.json | python3 -m json.tool | head -20

      # Run the security negative-path tests immediately after API readiness,
      # before lengthy network scanners, so auth bypass regressions fail fast.
      - name: Red Team Suite
        id: red_team_tests
        env:
          CI_SECURITY_BYPASS: "0"
        run: |
          pytest app/security/test_red_team_attacks.py \
            -v \
            --tb=short \
            --asyncio-mode=auto

      # ────────────────────────────────────────────────────────────────────────
      # FIX 2 — OWASP ZAP: removed duplicate -J flag.
      # The action already injects its own -J report_json.json internally;
      # passing a second -J caused the action's own report-lookup step to
      # fail ("Failed to locate the json report generated by ZAP Scan!")
      # even though the scan itself completed (141 PASS, 0 High/Medium).
      # We rename the action's default output ourselves in the next step.
      #
      # FIX 2b — same collision on -r: the action also injects its own
      # default -r report_html.html. Our explicit "-r zap-report.html"
      # made ZAP see -r twice, so only the last one won and report_html.html
      # was never written — the action's own internal artifact-upload step
      # then failed with "File .../report_html.html does not exist". Not
      # fatal (this step has continue-on-error), but avoidable: drop our -r
      # entirely and rename the action's default output ourselves instead.
      # ────────────────────────────────────────────────────────────────────────
      - name: OWASP ZAP Scan
        id: zap_scan
        uses: zaproxy/action-full-scan@v0.13.0
        continue-on-error: true
        with:
          target: "http://127.0.0.1:8000"
          cmd_options: "-I"
          fail_action: false
          allow_issue_writing: false

      - name: Normalize ZAP report names
        if: always()
        run: |
          if [ -f report_json.json ]; then
            cp report_json.json zap-report.json
          fi
          if [ -f report_html.html ]; then
            cp report_html.html zap-report.html
          fi

      - name: Show ZAP Findings
        if: always()
        continue-on-error: true
        run: |
          echo "---- ZAP SUMMARY ----"
          if [ -f zap-report.json ]; then
            python3 -c "
          import json, sys
          try:
              d = json.load(open('zap-report.json'))
              alerts = d.get('site', [{}])[0].get('alerts', [])
              highs = [a for a in alerts if a.get('riskdesc','').startswith('High')]
              mediums = [a for a in alerts if a.get('riskdesc','').startswith('Medium')]
              print(f'High risk: {len(highs)}, Medium risk: {len(mediums)}, Total: {len(alerts)}')
              for a in highs[:5]:
                  print(f'  HIGH: {a.get(\"alert\",\"?\")} — {a.get(\"url\",\"?\")}')
          except Exception as e:
              print(f'Could not parse ZAP report: {e}')
          "
          else
            echo "No ZAP report generated"
          fi

      # ────────────────────────────────────────────────────────────────────────
      # FIX 3 — Nuclei: v2 action does not accept a generic `args:` input.
      # Only named inputs are recognized (target, output, json, flags, etc).
      # Passing `args:` silently dropped every option, so nuclei had no
      # target and failed immediately ("You need to set a target...").
      #
      # FIX 3b — `json: true` maps to the legacy `-json` flag, which Nuclei
      # 3.11 removed entirely (replaced by `-je`/json-export). The action
      # still injects `-json` when this input is true, so it crashed with
      # "flag provided but not defined: -json". Use `json-export:` directly
      # instead, which maps to the current `-je` flag.
      #
      # FIX 3c — `-es` (exclude-severity) requires a value right after it.
      # Our flag string put `-nh` immediately after `-es`, so nuclei read
      # `-nh` as an (invalid) severity value: "invalid value \"-nh\" for
      # flag -es". We never actually wanted to exclude a severity tier —
      # `-es` served no purpose here, so it's dropped entirely.
      # ────────────────────────────────────────────────────────────────────────
      - name: Nuclei Scan
        id: nuclei_scan
        uses: projectdiscovery/nuclei-action@v3.1.0
        continue-on-error: true
        with:
          args: "-u http://127.0.0.1:8000 -jsonl-export nuclei.jsonl -nh -timeout 10 -rate-limit 50"

      # ────────────────────────────────────────────────────────────────────────
      # FIX 3d — this parser was reading nuclei.json (the structured/pretty
      # JSON-export format — a multi-line array), but treating it as
      # line-delimited JSON. With 0 findings that silently produced an
      # empty list; the first run with REAL findings broke it instantly:
      # "AttributeError: 'list' object has no attribute 'get'", and since
      # this step had no continue-on-error, it failed the entire job.
      # The action always writes a true JSON-Lines file to nuclei.jsonl
      # regardless of our config (visible in its own invocation as
      # `-jle=nuclei.jsonl`) — that's the correct file for this parsing
      # style. Also added a full try/except and continue-on-error so a
      # future format surprise degrades gracefully instead of failing CI.
      # ────────────────────────────────────────────────────────────────────────
      - name: Show Nuclei Findings
        if: always()
        continue-on-error: true
        run: |
          echo "---- NUCLEI RESULTS ----"
          if [ -f nuclei.jsonl ] && [ -s nuclei.jsonl ]; then
            python3 -c "
          import json
          try:
              findings = []
              with open('nuclei.jsonl') as f:
                  for line in f:
                      line = line.strip()
                      if not line:
                          continue
                      try:
                          obj = json.loads(line)
                      except Exception:
                          continue
                      if isinstance(obj, dict):
                          findings.append(obj)
                      elif isinstance(obj, list):
                          findings.extend(x for x in obj if isinstance(x, dict))
              crits = [x for x in findings if x.get('info', {}).get('severity') in ['critical', 'high']]
              print(f'Total findings: {len(findings)}, Critical/High: {len(crits)}')
              for c in crits[:10]:
                  info = c.get('info', {})
                  print(f\"  [{info.get('severity','?').upper()}] {info.get('name','?')} — {c.get('matched-at','?')}\")
          except Exception as e:
              print(f'Could not parse Nuclei report: {e}')
          "
          else
            echo "No Nuclei findings or empty report"
          fi

      # ────────────────────────────────────────────────────────────────────────
      # FIX 4 — Schemathesis: CLI flags renamed in 4.x.
      # --hypothesis-max-examples -> --max-examples
      # --hypothesis-suppress-health-check -> --suppress-health-check
      # The old flags caused an immediate usage error, so zero API fuzzing
      # actually ran (silently swallowed by `|| true`).
      #
      # FIX 4b — --junit-xml is not a valid option on the installed 4.10.2
      # CLI ("No such option '--junit-xml'"), so it aborted before running
      # a single test. Dropped; --report already gives a readable summary.
      #
      # FIX 4c — --show-trace is also not a valid option on this CLI
      # ("No such option '--show-trace'"). Same story — dropped.
      #
      # FIX 4d — `--report=schemathesis-report.txt` broke too: in this
      # version --report takes a FORMAT (junit/vcr/har/ndjson), not a
      # filename ("invalid choice(s): schemathesis-report.txt"). This is
      # the third time a schemathesis flag has changed meaning between
      # versions. Rather than keep chasing it, we stop relying on
      # --report entirely and just capture the CLI's own stdout via
      # shell redirection — that can't be broken by a future flag rename.
      # ────────────────────────────────────────────────────────────────────────
      - name: API Fuzzing (Schemathesis)
        id: schemathesis_scan
        continue-on-error: true
        run: |
          echo "---- SCHEMATHESIS RESULTS ----"
          schemathesis run \
            http://localhost:8000/openapi.json \
            --checks all \
            --exclude-checks=positive_data_acceptance \
            --exclude-deprecated \
            --exclude-path-regex '/api/v1/auth/webauthn/(register|authenticate)/start' \
            --max-examples=50 \
            --suppress-health-check=too_slow,filter_too_much \
            --continue-on-failure \
            2>&1 | tee schemathesis-report.txt || true

      # ────────────────────────────────────────────────────────────────────────
      # NEW — Dependency Vulnerability Audit (pip-audit)
      # Checks pinned requirements.txt versions against known CVEs.
      # Was already being installed but never actually run — pure waste.
      # ────────────────────────────────────────────────────────────────────────
      - name: Dependency Vulnerability Audit (pip-audit)
        id: pip_audit_scan
        continue-on-error: true
        run: |
          pip-audit -r requirements.txt --desc -f json -o pip-audit-report.json
          echo "---- PIP-AUDIT SUMMARY ----"
          if [ -f pip-audit-report.json ]; then
            python3 -c "
          import json
          try:
              d = json.load(open('pip-audit-report.json'))
              deps = d.get('dependencies', [])
              vulns = [x for x in deps if x.get('vulns')]
              print(f'Vulnerable packages: {len(vulns)}')
              for v in vulns[:10]:
                  ids = [i.get('id','?') for i in v.get('vulns', [])]
                  print(f\"  {v.get('name','?')}=={v.get('version','?')}: {ids}\")
          except Exception as e:
              print(f'Could not parse pip-audit report: {e}')
          "
          else
            echo "No pip-audit report generated"
          fi

      # ────────────────────────────────────────────────────────────────────────
      # NEW — OSV-Scanner (Google, free/open-source). Second opinion SCA tool
      # alongside pip-audit: queries the OSV.dev database directly across
      # your full dependency tree (including transitive deps pip-audit's
      # feed can sometimes miss), and additionally understands non-Python
      # manifests if any get added later (package.json, Gemfile, etc.) —
      # useful for an identity platform where supply-chain hygiene across
      # every language in the repo matters, not just Python.
      # ────────────────────────────────────────────────────────────────────────
      - name: OSV-Scanner (secondary SCA)
        id: osv_scan
        continue-on-error: true
        run: |
          # Pin the scanner version and use the documented Go module install path.
          # A missing report is a hard failure in the security summary; never
          # turn an unavailable scanner into a clean/empty result.
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.3.3
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          "$HOME/go/bin/osv-scanner" scan source --recursive --format json . > osv-report.json || scan_status=$?
          if [ ! -s osv-report.json ]; then
            echo "::error::OSV-Scanner did not produce osv-report.json"
            exit 1
          fi
          echo "---- OSV-SCANNER SUMMARY ----"
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("osv-report.json").read_text(encoding="utf-8"))
          results = report.get("results", [])
          total = 0
          for result in results:
              if not isinstance(result, dict):
                  continue
              for package in result.get("packages", []):
                  if not isinstance(package, dict):
                      continue
                  vulnerabilities = package.get("vulnerabilities", [])
                  total += len(vulnerabilities)
                  metadata = package.get("package", {})
                  name = metadata.get("name", "unknown") if isinstance(metadata, dict) else "unknown"
                  version = metadata.get("version", "unknown") if isinstance(metadata, dict) else "unknown"
                  for vulnerability in vulnerabilities:
                      if isinstance(vulnerability, dict):
                          aliases = vulnerability.get("aliases", [])
                          advisory = vulnerability.get("id", "unknown")
                          print(f"VULNERABLE: {name}=={version} {advisory} aliases={aliases}")
          print(f"Total vulnerabilities found: {total}")
          PY
          # Exit code 1 means findings; the validated JSON is evaluated by the gate.
          # Higher exit codes indicate scanner execution failure.
          if [ "${scan_status:-0}" -gt 1 ]; then
            echo "::error::OSV-Scanner failed to complete; review scanner output"
            exit "${scan_status}"
          fi

      # ────────────────────────────────────────────────────────────────────────
      # NEW — Static Analysis (bandit)
      # Catches insecure code patterns (hardcoded secrets, eval usage, weak
      # crypto, etc.) that HTTP-level scanners (ZAP/Nuclei) can't see.
      # Was already being installed but never actually run — pure waste.
      # ────────────────────────────────────────────────────────────────────────
      - name: Static Analysis (bandit)
        id: bandit_scan
        continue-on-error: true
        run: |
          bandit -r app/ -f json -o bandit-report.json || true
          echo "---- BANDIT SUMMARY ----"
          if [ -f bandit-report.json ]; then
            python3 -c "
          import json
          try:
              d = json.load(open('bandit-report.json'))
              results = d.get('results', [])
              highs = [r for r in results if r.get('issue_severity') == 'HIGH']
              mediums = [r for r in results if r.get('issue_severity') == 'MEDIUM']
              print(f'Total issues: {len(results)}, High: {len(highs)}, Medium: {len(mediums)}')
              for r in (highs + mediums)[:10]:
                  print(f\"  [{r.get('issue_severity')}] {r.get('test_name','?')} — {r.get('filename','?')}:{r.get('line_number','?')}\")
          except Exception as e:
              print(f'Could not parse bandit report: {e}')
          "
          else
            echo "No bandit report generated"
          fi

      # Run the repository's adversarial invariant tests as an explicit gate.
      # Pynguin currently requires pytest <9, while the patched pytest 9.0.3
      # is required to eliminate the OSV tmpdir vulnerability. Avoid installing
      # a known-vulnerable test runner just for an optional, non-blocking step.
      - name: Adversarial invariant tests
        run: |
          pytest app/security/test_break_attempts/ -v --tb=short

      # ────────────────────────────────────────────────────────────────────────
      # NEW — Container image scan (Trivy). Standard in mature security
      # pipelines: pip-audit/bandit cover source and dependencies, but
      # nothing here previously scanned the actual container image for OS
      # package CVEs, misconfigurations, or embedded secrets. Guarded to
      # no-op safely if there's no Dockerfile in this repo yet.
      # ────────────────────────────────────────────────────────────────────────
      - name: Check for Dockerfile
        id: dockerfile_check
        run: |
          if [ -f Dockerfile ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image for container scan
        if: steps.dockerfile_check.outputs.found == 'true'
        continue-on-error: true
        run: docker build -t meika-secure-id:scan .

      - name: Trivy Container Image Scan
        if: steps.dockerfile_check.outputs.found == 'true'
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: meika-secure-id:scan
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-image.sarif

      # ────────────────────────────────────────────────────────────────────────
      # NEW — Trivy config/IaC scan. Distinct from the fs scan (dependency
      # CVEs) and the image scan (OS package CVEs) — this checks the
      # Dockerfile itself, any Kubernetes/Terraform/CloudFormation files,
      # and GitHub Actions workflow files for misconfigurations (e.g.
      # running as root, missing HEALTHCHECK, overly-permissive workflow
      # permissions). Runs unconditionally since it scans whatever IaC
      # exists in the repo, not just a Dockerfile.
      # ────────────────────────────────────────────────────────────────────────
      - name: Trivy Config/IaC Scan
        id: trivy_config_scan
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-config.sarif

      # ────────────────────────────────────────────────────────────────────────
      # 11. Generate SBOM
      # ────────────────────────────────────────────────────────────────────────
      - name: Generate SBOM
        run: |
          cyclonedx-py requirements \
            --of JSON \
            -o bom.json \
            requirements.txt
          echo "SBOM generated:"
          python3 -c "
          import json
          d = json.load(open('bom.json'))
          components = d.get('components', [])
          print(f'  {len(components)} components in SBOM')
          "

      # ────────────────────────────────────────────────────────────────────────
      # 12. Security Summary
      # ────────────────────────────────────────────────────────────────────────
      - name: Enforce deep security gate
        if: always()
        env:
          ZAP_OUTCOME: ${{ steps.zap_scan.outcome }}
          NUCLEI_OUTCOME: ${{ steps.nuclei_scan.outcome }}
          SCHEMATHESIS_OUTCOME: ${{ steps.schemathesis_scan.outcome }}
          PIP_AUDIT_OUTCOME: ${{ steps.pip_audit_scan.outcome }}
          OSV_OUTCOME: ${{ steps.osv_scan.outcome }}
          BANDIT_OUTCOME: ${{ steps.bandit_scan.outcome }}
          TRIVY_CONFIG_OUTCOME: ${{ steps.trivy_config_scan.outcome }}
        run: python3 scripts/security_summary.py

      # ────────────────────────────────────────────────────────────────────────
      # 13. Upload ALL security artifacts
      # ────────────────────────────────────────────────────────────────────────
      - name: Upload Security Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deep-security-results
          retention-days: 30
          if-no-files-found: ignore
          path: |
            fuzz_results/
            bom.json
            zap-report.html
            zap-report.json
            nuclei.json
            nuclei.jsonl
            schemathesis-report.txt
            pip-audit-report.json
            osv-report.json
            bandit-report.json
            trivy-image.sarif
            trivy-config.sarif
            /tmp/uvicorn.log

      # ────────────────────────────────────────────────────────────────────────
      # 14. Print server logs on failure for debugging
      # ────────────────────────────────────────────────────────────────────────
      - name: Print API Server Logs (on failure)
        if: failure()
        run: |
          echo "=== Uvicorn startup log ==="
          cat /tmp/uvicorn.log || echo "No log available"

      # If you wish to fail your job when the Quality Gate is red, uncomment the
      # following lines. This would typically be used to fail a deployment.
      # - uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
      #   timeout-minutes: 5
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      
      # SonarQube is an external service and may not be reachable from GitHub-hosted
      # runners (for example, a server bound to localhost on a developer machine).
      # Detect availability explicitly; never report an unreachable server as a scan pass.
      - name: Check SonarQube scanner API availability
        id: sonar_preflight
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SONAR_TOKEN:-}" ] || [ -z "${SONAR_HOST_URL:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SonarQube scan skipped: SONAR_TOKEN or SONAR_HOST_URL is not configured."
            exit 0
          fi
          # Probe the exact endpoint the scanner failed to query. Checking
          # /api/system/status alone can pass while the analysis API is blocked.
          version_url="${SONAR_HOST_URL%/}/api/v2/analysis/version"
          if curl --fail --silent --show-error --max-time 10 \
              --user "${SONAR_TOKEN}:" "$version_url" \
              -o "$RUNNER_TEMP/sonar-analysis-version.txt" &&
             [ -s "$RUNNER_TEMP/sonar-analysis-version.txt" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "SonarQube analysis API is reachable."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SonarQube scan skipped: analysis API endpoint is unreachable or unsupported. Verify server version, proxy routing, and token; this is not reported as a scan pass."
          fi

      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        if: steps.sonar_preflight.outputs.available == 'true'
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      
      

