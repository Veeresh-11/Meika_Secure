name: GitHub Actions Workflow Security Audit

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: workflow-security-audit-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Audit workflow supply-chain security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout without persisting credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Analyze GitHub Actions workflows
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: .github/workflows
          version: v1.29.0
          advanced-security: false
          annotations: true
          min-severity: low
          min-confidence: medium
          token: ${{ github.token }}
